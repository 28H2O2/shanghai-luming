    "story": "到静安寺一带找愚园，能找到一块路牌，却找不到当年的园门了。愚园原在今天的常德路口，愚园路就借了它的名字。翻开一九一〇年版《上海指南》，还能照着文字游一次园：过桥有一棚紫藤，池上有座名叫“如舫”的亭子。那时进门只消一角钱，坐下喝碗茶，反倒要花两角。",
    "fun_fact": "清末逛愚园，一碗茶的钱够买两张门票。",
