  {
    "name": "国福路",
    "pinyin": "Guofu Lu",
    "old_names": [],
    "district": "杨浦区",
    "area_group": "江湾五角场",
    "naming_type": [
      "其他"
    ],
    "story": "今天的国福路很短，从邯郸路走到政修路不过三百多米。1940年筑路时并不止这一段，往北穿过今天的邯郸路，一直伸到界泓浜。抗战胜利后，南北两段沿用“大上海计划”的命名办法统称国福路，直到20世纪50年代复旦向东扩展，北段才并入校园。留下的南段顺着门牌看过去，51号是陈望道，61号是苏步青，65号是陈建功，三位学者的旧居都在这条短街上。",
    "credibility": "已查证",
    "sources": [
      {
        "title": "张国伟 · 国福路的个性",
        "url": "https://alumni.fudan.edu.cn/d8/07/c20636a382983/page.htm",
        "scope": "复旦校友会刊载。作者交代筑路、两段统名、北段并入校园，以及三处门牌与住户。"
      }
    ],
    "notes": "旧路南段的街名编号有两种记载，详见出处。",
