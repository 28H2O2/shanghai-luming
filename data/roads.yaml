    "story": "2005年4月，创智天地一带的新规划道路获准命名，这条东西向马路起初叫智康路。这名字只用了几个月。到了10月，开发部门申请改名，看中四周有复旦、同济、上海财大等高校，想用贯穿街区的马路呼应这片大学城。同年12月7日，大学路正式获批。",
