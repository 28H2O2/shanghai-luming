    "story": "1922年修翔殷路时，马路跨过引翔、殷行两乡，名字便从两地各取一字拼成。早年的翔殷路长得多。它从军工路一路向西直通复旦门口，后来西段改称邯郸路，原本一整条路才拆成两个名字。如今站在五角场环岛往两边看，东面的翔殷路和西面的邯郸路，连在一起仍是当年那一条路。",
