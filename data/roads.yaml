    ],
    "district": "杨浦区",
    "area_group": "江湾五角场",
    "naming_type": [
      "起讫型"
    ],
    "story": "翔殷路把两个老地名各留下了一个字。1922年开筑的马路跨过引翔、殷行两乡，从前者取“翔”，从后者取“殷”。它原来比今天同名的路长，从军工路往西一直修到复旦门口。后来西段换过名字，成了邯郸路。今天站在五角场环岛看，东面的翔殷路和西面的邯郸路，仍接得上当年的那一横。",
    "credibility": "已查证",
