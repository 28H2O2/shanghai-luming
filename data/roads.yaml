    ],
    "story": "大学路的第一个名字只用了几个月。2005年4月，创智天地一带新规划的道路获准命名，其中一条东西向的马路叫智康路。到了10月，开发部门又为它申请改名，理由是四周有复旦、同济、上海财大等高校，一条贯穿街区的路，正好能把“大学城”点在路牌上。12月7日，大学路这个名字正式获批。",
