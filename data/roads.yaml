  {
    "name": "国福路",
    "pinyin": "Guofu Lu",
    "old_names": [],
    "district": "杨浦区",
    "area_group": "江湾五角场",
    "naming_type": [
      "其他"
    ],
    "story": "国福路从邯郸路走到政修路，只有三百多米。1940年筑路时，它还穿过今天的邯郸路，一直向北伸到界泓浜。抗战胜利后，南北两段沿用“大上海计划”的命名办法，合称国福路。上世纪五十年代复旦向东扩展，北段并入校园。留下的南段虽短，却能按门牌找到三位学者的旧居：51号陈望道，61号苏步青，65号陈建功。",
    "credibility": "已查证",
    "sources": [
      {
        "title": "张国伟 · 国福路的个性",
        "url": "https://alumni.fudan.edu.cn/d8/07/c20636a382983/page.htm",
        "scope": "复旦校友会刊载。作者交代筑路、两段统名、北段并入校园，以及三处门牌与住户。"
      }
    ],
    "notes": "旧路南段的街名编号有两种记载，详见出处。",
