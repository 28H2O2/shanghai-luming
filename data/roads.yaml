    "story": "张江刚开发时，新路在工程上只用一号、二号这样的数字区分。1994年的浦东新区交通地名规划方案提出，园区道路可以选用科学家姓名，举的例子就是祖冲之路。这位推算圆周率的数学家于是出现在路牌上。沿着祖冲之路往前走，还会遇到牛顿路、居里路和哈雷路，几位不同时代的科学家在张江成了邻居。",
