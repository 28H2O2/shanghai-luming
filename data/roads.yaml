    "story": "宝山淞南一带的长江南路，早年叫大上海支路。北侧与它相连的干道叫大上海路，两条马路原本成对存在。1959年至1960年间，两路一同改以长江命名，主路成了长江路，南侧支路则定名长江南路。从前51路和52路公交车开往吴淞时，都要绕经这里去往上钢一厂和吴淞煤气厂，路名换过之后，工业区的老通勤线一直延续了下来。",
