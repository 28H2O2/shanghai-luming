    "story": "复旦校门前这段路，抗战胜利后叫过魏德迈路。1950年5月，上海市政府公布一批新路名，它为纪念邯郸战役改称邯郸路。新名刚用上不久，旧名还在报上露了次面。6月里吴淞煤气厂登广告时沿用了旧稿，忘了换掉上面的旧路名，读者来信指出后，厂方随后也在《解放日报》登了回信说明原委。",
