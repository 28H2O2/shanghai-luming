    "district": "杨浦区、虹口区",
    "area_group": "江湾五角场",
    "naming_type": [
      "纪念性改名"
    ],
    "story": "邯郸路换名那年，一则没改过来的广告上了报。复旦校门前的这段路，抗战胜利后曾叫魏德迈路。1950年5月，上海市政府公布一批新路名，其中就有纪念邯郸战役的邯郸路。到了6月，吴淞煤气厂登广告时还写着旧路名。读者来信指出，厂方随后也在《解放日报》回信，说明广告沿用了旧稿，忘了改掉上面的路名。",
    "credibility": "已查证",
